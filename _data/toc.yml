# Master plan of the book.
# - Chapters are ordered by how soon a learner needs them for everyday conversation.
# - Each item is one five-minute lesson. id = "CC-II" (chapter-item).
# - status: published | planned
# - A published item's page lives at lessons/<id>-<slug>.md with permalink /lessons/<id>/.
# - IDs never change once published. To insert a lesson between existing ones,
#   append it to the chapter with the next free number and reorder the list;
#   the list order (not the number) is the reading order.

- chapter: 1
  title: "Who's Talking: Pronouns, Ser and Estar"
  summary: "Say who you are, how you are, and where you're from."
  items:
    - { id: "01-01", title: "Subject pronouns: eu, você, a gente…", status: published }
    - { id: "01-02", title: "Ser (1): Eu sou… / Você é…", status: published }
    - { id: "01-03", title: "Estar (1): Tudo bem? / Estou bem", status: published }
    - { id: "01-04", title: "Ser vs. estar: the core distinction", status: planned }
    - { id: "01-05", title: "Saying no: não", status: planned }
    - { id: "01-06", title: "Yes/no questions and short answers", status: planned }

